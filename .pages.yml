content:
  # Site-wide Settings (edit once, applies to all pages)
  - name: site-settings
    label: Site Settings (Shared Across All Pages)
    type: file
    path: content/site-settings.json
    fields:
      # Top Bar
      - name: phone-1
        label: Phone Number 1 (Top Bar)
        type: string
      - name: phone-2
        label: Phone Number 2 (Top Bar)
        type: string
      - name: email
        label: Email Address (Top Bar)
        type: string
      - name: email-display
        label: Email Display Text
        type: string
      - name: tagline
        label: Church Tagline (Mobile Top Bar)
        type: string

      # Social Links (Top Bar & Footer)
      - name: youtube-link
        label: YouTube Link
        type: string
      - name: instagram-link
        label: Instagram Link
        type: string
      - name: facebook-link
        label: Facebook Link
        type: string
      - name: twitter-link
        label: Twitter Link
        type: string

      # Footer
      - name: footer-description
        label: Footer Description
        type: text
      - name: footer-address
        label: Footer Address
        type: text
      - name: footer-phone-1
        label: Footer Phone 1
        type: string
      - name: footer-phone-2
        label: Footer Phone 2
        type: string
      - name: footer-email
        label: Footer Email
        type: string
      - name: footer-website
        label: Footer Website
        type: string

      # Newsletter Section
      - name: newsletter-heading
        label: Newsletter Heading
        type: string
      - name: newsletter-description
        label: Newsletter Description
        type: text

  # Homepage
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      # Hero Section
      - name: hero-bg-image
        label: Hero Background Image URL
        type: string
      - name: hero-heading
        label: Hero Heading
        type: string
      - name: hero-tagline
        label: Hero Tagline
        type: string
      - name: hero-description
        label: Hero Description
        type: text

      # Mission & Vision
      - name: mission-image
        label: Mission Section Image URL
        type: string
      - name: mission-heading
        label: Mission Heading
        type: string
      - name: mission-text
        label: Mission Statement
        type: text
      - name: vision-heading
        label: Vision Heading
        type: string
      - name: vision-text
        label: Vision Statement
        type: text
      - name: branches-count
        label: Branch Count Text
        type: string

      # Ministries Section
      - name: ministries-heading
        label: Ministries Section Heading
        type: string
      - name: ministries-tagline
        label: Ministries Tagline
        type: string

      # Leadership Section
      - name: leadership-heading
        label: Leadership Section Heading
        type: string
      - name: leadership-tagline
        label: Leadership Tagline
        type: string

      # Bishop 1
      - name: bishop-1-photo
        label: Bishop 1 Photo URL
        type: string
      - name: bishop-1-name
        label: Bishop 1 Name
        type: string
      - name: bishop-1-title
        label: Bishop 1 Title
        type: string
      - name: bishop-1-bio
        label: Bishop 1 Bio
        type: text

      # Bishop 2
      - name: bishop-2-photo
        label: Bishop 2 Photo URL
        type: string
      - name: bishop-2-name
        label: Bishop 2 Name
        type: string
      - name: bishop-2-title
        label: Bishop 2 Title
        type: string
      - name: bishop-2-bio
        label: Bishop 2 Bio
        type: text

      # Scripture Verses
      - name: verse-1-text
        label: Scripture Verse 1 Text
        type: text
      - name: verse-1-ref
        label: Scripture Verse 1 Reference
        type: string
      - name: verse-2-text
        label: Scripture Verse 2 Text
        type: text
      - name: verse-2-ref
        label: Scripture Verse 2 Reference
        type: string

      # Giving Section
      - name: giving-heading
        label: Giving Section Heading
        type: string
      - name: giving-verse
        label: Giving Scripture Verse
        type: text
      - name: mpesa-women-paybill
        label: Women's Ministry Paybill
        type: string
      - name: mpesa-women-account
        label: Women's Ministry Account
        type: string
      - name: mpesa-radio-paybill
        label: Radio Ministry Paybill
        type: string
      - name: mpesa-radio-account
        label: Radio Ministry Account
        type: string
      - name: mpesa-church-paybill
        label: Church Offering Paybill
        type: string
      - name: mpesa-church-account
        label: Church Offering Account
        type: string

      # Global Reach Section
      - name: global-heading
        label: Global Section Heading
        type: string
      - name: global-tagline
        label: Global Section Tagline
        type: string
      - name: stat-branches
        label: Number of Branches
        type: string
      - name: stat-countries
        label: Number of Countries
        type: string
